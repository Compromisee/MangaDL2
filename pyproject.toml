[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weebcentral-downloader"
version = "2.6.2"
description = "Download manga from weebcentral.com as CBZ, PDF or EPUB - CLI and GUI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "rich>=13.0",
    "Pillow>=10.0",
    "fpdf2>=2.7",
    "EbookLib>=0.18",
]

[project.optional-dependencies]
gui = ["pywebview>=5.0"]
tui = ["textual>=0.60"]
all = ["pywebview>=5.0", "textual>=0.60"]

[project.scripts]
weebcentral = "weebcentral.cli:main"
weebcentral-gui = "weebcentral.gui:run_gui"
weebcentral-tui = "weebcentral.tui:run_tui"

[tool.setuptools.packages.find]
include = ["weebcentral*"]

[tool.setuptools.package-data]
"weebcentral.gui" = ["web/*"]
