[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mangadl"
version = "1.4.22"
description = "Download manga, manhwa and manhua from 28 sites as CBZ, PDF or EPUB - CLI, menu, TUI and GUI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "rich>=13.0",
    "Pillow>=10.0",
    "fpdf2>=2.7",
    "EbookLib>=0.18",
]

[project.optional-dependencies]
gui = ["pywebview>=5.0"]
tui = ["textual>=0.60"]
tray = ["pystray>=0.19", "Pillow>=10.0"]
dev = ["pytest>=7.0"]
all = ["pywebview>=5.0", "textual>=0.60", "pystray>=0.19"]

[project.urls]
Homepage = "https://github.com/Compromisee/MDL"
Issues = "https://github.com/Compromisee/MDL/issues"

[project.scripts]
mangadl = "mangadl.cli:main"
mangadl-gui = "mangadl.gui:run_gui"
mangadl-tui = "mangadl.tui:run_tui"

[tool.setuptools.packages.find]
include = ["mangadl*"]

[tool.setuptools.package-data]
"mangadl.gui" = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live sites; needs MANGADL_NETWORK_TESTS=1"]
